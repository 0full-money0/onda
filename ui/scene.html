<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Onda</title>
<style>
  :root { --c1:#ff9a4d; --c2:#ff6a3d; --frost:linear-gradient(transparent, transparent);
    --ac:color-mix(in oklab, var(--c1) 58%, #fff); --ease:cubic-bezier(.22,1,.36,1); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#050507; overflow:hidden; user-select:none; color:#fff; cursor:default;
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
  svg { width:18px; height:18px; fill:currentColor; display:block; }

  /* ---------- fond : image calculée une fois, clip vidéo en option ---------- */
  #bg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#07070b; }
  #bg:not([src]) { visibility:hidden; }
  #vid { position:fixed; left:50%; top:50%; width:var(--vw, 1280px); height:var(--vh, 720px); margin:calc(var(--vh, 720px) / -2) 0 0 calc(var(--vw, 1280px) / -2); transform:scale(var(--vs, 2.5));
    pointer-events:none; opacity:0; transition:opacity 1.2s; }
  #vid.on { opacity:1; }
  #vid iframe { width:100%; height:100%; border:0; display:block; }
  #vshade { position:fixed; inset:0; display:none; background:radial-gradient(100% 90% at 50% 45%, rgba(0,0,0,.22), rgba(0,0,0,.6)); }
  body.video #vshade { display:block; }

  /* ---------- verre liquide ---------- */
  .glass { position:relative; isolation:isolate; border:1px solid rgba(255,255,255,.26);
    background:linear-gradient(145deg, rgba(255,255,255,.24) 0%, rgba(255,255,255,.08) 42%, rgba(255,255,255,.15) 100%), rgba(30,30,40,.86);
    box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55), inset 0 -1px 1px rgba(255,255,255,.14),
      inset 1.5px 0 1px rgba(255,255,255,.16), inset 0 0 24px rgba(255,255,255,.06), 0 26px 60px rgba(0,0,0,.45); }
  .glass::before { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:-1;
    background:radial-gradient(120% 70% at 12% -10%, rgba(255,255,255,.28), transparent 55%); }
  .frost { background:linear-gradient(145deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.06) 42%, rgba(255,255,255,.13) 100%),
      var(--frost) 0 0 / 100vw 100vh fixed no-repeat, rgba(30,30,40,.86); }

  /* ---------- transitions d'écran : tout glisse et fond, rien ne saute ---------- */
  .clock, .side, .flow, .dots, #lyrics, .bar, #nav, #empty, #home { transition:opacity .55s var(--ease), translate .8s var(--ease), scale .8s var(--ease); }
  body:not(.ready) .clock { opacity:0; translate:0 -4vh; }
  body:not(.ready) .side { opacity:0; translate:6vh 0; }
  body:not(.ready) .flow { opacity:0; scale:.9; }
  body:not(.ready) .bar { opacity:0; translate:0 6vh; }
  body:not(.ready) #nav { opacity:0; translate:0 -3vh; }
  body:not(.ready) #home, body:not(.ready) #empty, body:not(.ready) .dots, body:not(.ready) #lyrics { opacity:0; }
  body.ready .side { transition-delay:.12s; } body.ready .flow { transition-delay:.2s; } body.ready .bar { transition-delay:.3s; }
  body.ready.settled .side, body.ready.settled .flow, body.ready.settled .bar { transition-delay:0s; }
  body[data-view="home"] :is(.side, .flow, .dots, #lyrics, .bar, #empty),
  body[data-view="library"] :is(.side, .flow, .dots, #lyrics, #empty),
  body[data-view="service"] :is(.clock, .side, .flow, .dots, #lyrics, #empty, .bar) { opacity:0; pointer-events:none; }
  body[data-view="library"] .flow, body[data-view="service"] .flow { scale:.94; }
  body[data-view="home"] .bar { translate:0 6vh; }
  #dim { position:fixed; inset:0; background:rgba(4,4,8,.62); opacity:0; pointer-events:none; transition:opacity .5s; }
  body[data-view="service"] #dim { opacity:1; }
  #login { position:fixed; inset:0; opacity:0; pointer-events:none; transition:opacity .5s var(--ease); }
  body[data-view="service"] #login { opacity:1; }
  .lgHead { position:absolute; top:3.2vh; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:2vh; text-align:left; }
  .lgHead .mono { margin:0; flex:none; }
  .lgHead h2 { margin:0; font-size:2.9vh; font-weight:700; letter-spacing:-.01em; }
  .lgHead p { margin:.5vh 0 0; font-size:1.5vh; color:rgba(255,255,255,.62); }
  .lgFoot { position:absolute; top:87.5vh; left:0; right:0; display:flex; justify-content:center; gap:1.2vh; }
  body[data-view="service"] .lgFoot { pointer-events:auto; }
  .ghost { padding:1.2vh 2.2vh; border-radius:99px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); font-weight:600; font-size:1.5vh;
    color:rgba(255,255,255,.85); transition:.25s var(--ease); }
  .ghost:hover { background:rgba(255,255,255,.2); color:#fff; }

  /* ---------- horloge ---------- */
  .clock { position:fixed; top:6.5vh; left:0; right:0; text-align:center; pointer-events:none; }
  .date { font-size:1.45vh; font-weight:600; color:var(--ac); letter-spacing:.03em; margin-bottom:1.2vh; text-shadow:0 1px 8px rgba(0,0,0,.5); }
  .time { display:inline-block; font-family:"Bahnschrift","Segoe UI",sans-serif; font-stretch:75%; font-weight:300;
    font-size:23vh; line-height:1; transform:scale(.78, 1.28); transform-origin:50% 0; letter-spacing:.01em;
    color:color-mix(in srgb, var(--ac) 10%, transparent); -webkit-text-stroke:.2vh color-mix(in srgb, var(--ac) 88%, transparent);
    paint-order:stroke fill; text-shadow:0 .6vh 2.4vh rgba(0,0,0,.35); }
  body[data-view="home"] .clock { scale:.62; translate:0 -2.5vh; }

  /* ---------- carrousel ---------- */
  .flow { position:fixed; left:0; right:0; top:37.5vh; height:40vh; perspective:1500px; perspective-origin:50% 45%; }
  .card { position:absolute; left:50%; top:0; width:27vh; margin-left:-13.5vh; padding:1.1vh 1.1vh 0; border-radius:2.6vh; cursor:pointer;
    transition:transform .75s var(--ease), opacity .5s; will-change:transform, opacity; }
  .cv { position:relative; width:24.8vh; height:24.8vh; border-radius:1.7vh; overflow:hidden; background:#16161d;
    box-shadow:0 .8vh 2.4vh rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.1); }
  .cv img { width:100%; height:100%; object-fit:cover; display:block; }
  .cv::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.22), transparent 38%, transparent 70%, rgba(255,255,255,.07)); }
  .card .t { margin-top:1.1vh; font-size:1.6vh; font-weight:650; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .s { font-size:1.25vh; color:rgba(255,255,255,.62); text-align:center; padding:.15vh 0 1.3vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .dimc { position:absolute; inset:0; border-radius:inherit; background:#000; opacity:0; transition:opacity .6s; pointer-events:none; }
  .dots { position:fixed; top:73vh; left:0; right:0; display:flex; justify-content:center; gap:1vh; }
  .dots i { width:.65vh; height:.65vh; border-radius:50%; background:rgba(255,255,255,.3); transition:.4s var(--ease); cursor:pointer; }
  .dots i.on { background:#fff; width:2vh; border-radius:1vh; }
  body.lyr .dots { opacity:0; pointer-events:none; }

  /* ---------- paroles : en grand, à côté de la pochette ---------- */
  #lyrics { position:fixed; left:calc(50% - 7vh); top:38.5vh; width:31vw; opacity:0; pointer-events:none;
    font-family:"Bahnschrift","Segoe UI",sans-serif; font-stretch:82%; text-transform:uppercase; }
  body.lyr #lyrics { opacity:1; }
  #lprev, #lnext { font-size:2.5vh; font-weight:600; color:rgba(255,255,255,.34); min-height:3.2vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #lcur { margin:1.4vh 0 1.6vh; font-size:7.4vh; font-weight:700; line-height:1.02; letter-spacing:.01em; min-height:15vh;
    text-shadow:0 .4vh 2.4vh rgba(0,0,0,.6), 0 0 4vh color-mix(in srgb, var(--c1) 45%, transparent); }
  #lcur span { display:inline-block; margin-right:.28em; animation:word .55s var(--ease) backwards; }
  @keyframes word { from { opacity:0; transform:translateY(.45em) scale(.88); } }

  /* ---------- liste de gauche ---------- */
  .side { position:fixed; right:5.5vw; top:33vh; width:27vh; transform:perspective(1000px) rotateY(-24deg); transform-origin:right center; }
  .head { display:flex; align-items:center; gap:1.1vh; margin:0 0 1.2vh .9vh; }
  .head img { width:4.2vh; height:4.2vh; border-radius:50%; object-fit:cover; box-shadow:0 0 0 1.5px rgba(255,255,255,.35), 0 .6vh 1.6vh rgba(0,0,0,.4); }
  .head b { display:block; font-size:1.7vh; font-weight:700; text-shadow:0 1px 8px rgba(0,0,0,.5); }
  .head span { display:block; font-size:1.15vh; color:rgba(255,255,255,.6); }
  .tr { position:relative; display:flex; align-items:center; gap:1.2vh; padding:.85vh 1.1vh; border-radius:1.6vh; cursor:pointer;
    border:1px solid transparent; transition:background .3s, transform .4s var(--ease); animation:rowIn .6s var(--ease) backwards; }
  @keyframes rowIn { from { opacity:0; transform:translateX(-2.5vh); } }
  .tr:hover { background:rgba(255,255,255,.1); transform:translateX(.4vh); }
  .tr img, .tr .ph { width:3.9vh; height:3.9vh; border-radius:.8vh; background:#222; flex:none; object-fit:cover; box-shadow:0 .4vh 1vh rgba(0,0,0,.35); }
  .tr b { display:block; font-size:1.42vh; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 6px rgba(0,0,0,.5); }
  .tr span.a { display:block; font-size:1.12vh; color:rgba(255,255,255,.55); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tr > div { min-width:0; flex:1; }
  .tr.on { padding:1.2vh 1.2vh; margin:.3vh -0.6vh;
    background:linear-gradient(120deg, color-mix(in srgb, var(--c1) 46%, transparent), color-mix(in srgb, var(--c1) 14%, rgba(255,255,255,.1))), rgba(30,30,40,.8);
    border-color:color-mix(in srgb, var(--ac) 65%, transparent); }
  .tr.on b { color:var(--ac); }
  .tr .acts { display:none; align-items:center; gap:.3vh; flex:none; }
  .tr:hover .acts { display:flex; }
  .tr .acts button { width:3vh; height:3vh; border-radius:50%; display:grid; place-items:center; color:rgba(255,255,255,.7); transition:.2s var(--ease); }
  .tr .acts button:hover { background:rgba(255,255,255,.2); color:#fff; scale:1.15; }
  .tr .acts button.on { color:#ff5d7a; }
  .tr .acts svg { width:1.7vh; height:1.7vh; }
  .eq { display:none; gap:2px; align-items:flex-end; height:1.5vh; flex:none; }
  .tr.on .eq { display:flex; }
  .eq i { width:2.5px; height:55%; border-radius:2px; background:var(--ac); }
  .eq i:nth-child(2) { height:100%; } .eq i:nth-child(3) { height:75%; }
  body.paused .eq { opacity:.4; }

  /* ---------- barre de lecture ---------- */
  .bar { position:fixed; left:calc(50% - min(500px, 46vw)); bottom:4.2vh; width:min(1000px, 92vw); height:62px; border-radius:99px;
    display:flex; align-items:center; gap:4px; padding:0 14px; }
  .ib { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:rgba(255,255,255,.85); transition:.2s var(--ease); flex:none; }
  .ib:hover { background:rgba(255,255,255,.16); color:#fff; scale:1.08; }
  .ib:active { scale:.9; }
  .ib.off { color:rgba(255,255,255,.32); }
  .ib.on, .ib.on:hover { background:#fff; color:#0b0b12; }
  #bFav.on, #bFav.on:hover { background:none; color:#ff5d7a; }
  .ib.big svg { width:22px; height:22px; }
  #play { width:42px; height:42px; background:rgba(255,255,255,.16); box-shadow:inset 0 1px 0 rgba(255,255,255,.45); }
  .src { display:flex; align-items:center; gap:7px; height:38px; padding:0 13px 0 8px; margin-right:4px; border-radius:99px; flex:none;
    background:rgba(255,255,255,.13); box-shadow:inset 0 1px 0 rgba(255,255,255,.35); font-size:12.5px; font-weight:600; transition:.2s var(--ease); }
  .src:hover { background:rgba(255,255,255,.22); }
  .src b { max-width:110px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .sdot { width:20px; height:20px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:11px; font-weight:800; color:#0b0b12; background:var(--sc, #fff); }
  .now { flex:1; min-width:0; display:flex; align-items:center; gap:11px; margin:0 10px; position:relative; height:100%; }
  .now img { width:38px; height:38px; border-radius:9px; object-fit:cover; flex:none; box-shadow:0 4px 12px rgba(0,0,0,.4); }
  .now img:not([src]) { visibility:hidden; }
  .now b { display:block; font-size:13.5px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now span { display:block; font-size:11.5px; color:rgba(255,255,255,.62); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now > div { min-width:0; flex:1; }
  .line { position:absolute; left:0; right:0; bottom:7px; height:2.5px; border-radius:2px; background:rgba(255,255,255,.16); overflow:hidden; }
  .line i { display:block; height:100%; width:100%; background:var(--ac); transform-origin:left; transform:scaleX(0); }

  /* ---------- navigation ---------- */
  #nav { position:fixed; left:2.2vw; top:2.4vh; height:46px; padding:0 8px 0 14px; border-radius:99px; display:none; align-items:center; gap:6px; z-index:300; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; letter-spacing:.2em; font-size:12px; margin-right:8px; }
  .brand svg { width:22px; height:22px; fill:none; }
  .tab { height:32px; padding:0 15px; border-radius:99px; font-size:13px; font-weight:600; color:rgba(255,255,255,.7); transition:.3s var(--ease); }
  .tab:hover { color:#fff; background:rgba(255,255,255,.1); }
  .tab.on { background:#fff; color:#0b0b12; }
  .sep { width:1px; height:20px; background:rgba(255,255,255,.2); margin:0 4px; }
  #libTools { display:none; align-items:center; }
  body[data-view="service"] #nav, body[data-view="service"] #libTools { display:flex; }

  /* ---------- écran de choix ---------- */
  #home { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; padding-top:28vh; text-align:center; opacity:0; pointer-events:none; }
  body.ready[data-view="home"] #home { opacity:1; pointer-events:auto; }
  #home h1 { margin:0; font-size:5vh; font-weight:700; letter-spacing:-.025em; text-shadow:0 2px 24px rgba(0,0,0,.55); }
  #home > p { margin:1.3vh 0 0; font-size:1.75vh; color:rgba(255,255,255,.66); }
  #tiles { display:flex; align-items:flex-end; gap:1.5vh; padding:1.5vh 1.9vh; margin-top:6vh; border-radius:3.4vh; }
  /* icône du dock : verre neutre, seul le logo porte la couleur du service */
  .orb { position:relative; width:8.8vh; height:8.8vh; border-radius:2.3vh; display:grid; place-items:center; cursor:pointer; color:var(--sc);
    background:linear-gradient(160deg, rgba(255,255,255,.2), rgba(255,255,255,.05)); border:1px solid rgba(255,255,255,.22);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 1vh 2.4vh rgba(0,0,0,.35);
    transform-origin:50% 100%; transition:transform .45s var(--ease), background .35s; animation:tileIn .8s var(--ease) backwards; }
  .orb.h1 { transform:scale(1.12); }
  .orb.h0 { transform:scale(1.3) translateY(-.5vh); background:linear-gradient(160deg, rgba(255,255,255,.32), rgba(255,255,255,.1)); }
  .orb.cur::after { content:""; position:absolute; left:50%; bottom:-1.05vh; width:.55vh; height:.55vh; margin-left:-.27vh; border-radius:50%; background:#fff; }
  @keyframes tileIn { from { opacity:0; transform:translateY(7vh) scale(.6); } }
  .orb svg { width:52%; height:52%; }
  #orbName { margin-top:3.4vh; font-size:3vh; font-weight:700; letter-spacing:-.01em; min-height:4.6vh; }
  #orbSub { margin:.5vh 0 2.6vh; font-size:1.55vh; color:rgba(255,255,255,.62); min-height:2vh; }
  .mono { width:7.6vh; height:7.6vh; margin:0 auto 1.9vh; border-radius:2.3vh; display:grid; place-items:center; color:#0b0b12;
    background:linear-gradient(150deg, #fff -20%, var(--sc) 55%, color-mix(in srgb, var(--sc) 70%, #000));
    box-shadow:inset 0 2px 1px rgba(255,255,255,.7), 0 1.2vh 3vh color-mix(in srgb, var(--sc) 50%, transparent); }
  .mono svg { width:56%; height:56%; }
  .sdot svg { width:72%; height:72%; }
  .orb svg, .mono svg, .sdot svg { fill:none; }
  #homeEsc { margin-top:1.8vh; font-size:1.25vh; color:rgba(255,255,255,.4); }

  /* ---------- bibliothèque ---------- */
  #lib { --la:var(--ac); --lbg:rgba(13,13,20,.86); --lrad:1.5vh; --lside:rgba(0,0,0,.24);
    position:fixed; left:9vw; right:9vw; top:35.5vh; bottom:13vh; border-radius:3vh; padding:0; display:flex; overflow:hidden;
    opacity:0; pointer-events:none; scale:.97; transition:opacity .45s var(--ease), scale .6s var(--ease);
    background:linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.02) 40%), var(--lbg); }
  /* chaque service a son allure : couleur, fond, arrondis */
  #lib[data-svc="spotify"]    { --la:#1ed760; --lbg:rgba(18,18,18,.93);  --lrad:.7vh;  --lside:rgba(0,0,0,.42); }
  #lib[data-svc="apple"]      { --la:#fa586a; --lbg:rgba(30,30,32,.9);   --lrad:1.3vh; --lside:rgba(255,255,255,.05); }
  #lib[data-svc="ytmusic"]    { --la:#ff4e45; --lbg:rgba(4,4,4,.94);     --lrad:.5vh;  --lside:rgba(255,255,255,.04); }
  #lib[data-svc="deezer"]     { --la:#a238ff; --lbg:rgba(16,13,22,.93);  --lrad:1.1vh; --lside:rgba(0,0,0,.34); }
  #lib[data-svc="soundcloud"] { --la:#ff6a1a; --lbg:rgba(20,18,17,.93);  --lrad:.4vh;  --lside:rgba(0,0,0,.34); }
  #lib[data-svc="amazon"]     { --la:#25d1da; --lbg:rgba(10,20,26,.93);  --lrad:1vh;   --lside:rgba(0,0,0,.34); }
  .lside { width:22vh; flex:none; padding:2.4vh 1.3vh; display:flex; flex-direction:column; gap:.5vh; background:var(--lside); border-right:1px solid rgba(255,255,255,.08); }
  .lsvc { display:flex; align-items:center; gap:1.1vh; padding:0 .8vh 1.8vh; font-size:1.7vh; font-weight:700; }
  .lsvc .sdot { background:var(--la); }
  .lnav { height:4.8vh; padding:0 1.5vh; border-radius:1.2vh; display:flex; align-items:center; gap:1.3vh; text-align:left; font-size:1.55vh; font-weight:600;
    color:rgba(255,255,255,.68); transition:.25s var(--ease); }
  .lnav svg { width:2vh; height:2vh; }
  .lnav:hover { color:#fff; background:rgba(255,255,255,.07); }
  .lnav.on { color:#fff; background:color-mix(in srgb, var(--la) 20%, transparent); box-shadow:inset 3px 0 0 var(--la); }
  .lnav.on svg { color:var(--la); }
  .lmain { position:relative; flex:1; min-width:0; display:flex; flex-direction:column; padding:2.2vh 2.4vh 0; }
  #sheet { position:absolute; inset:0; display:none; align-items:center; gap:5vh; padding:4vh 6vh; background:linear-gradient(160deg, rgba(255,255,255,.08), transparent 45%), var(--lbg); }
  #sheet.open { display:flex; animation:rise .5s var(--ease); }
  #sheet img { width:30vh; height:30vh; border-radius:calc(var(--lrad) * 1.6); object-fit:cover; flex:none; box-shadow:0 3vh 7vh rgba(0,0,0,.55); }
  #sheet small { font-size:1.3vh; letter-spacing:.16em; text-transform:uppercase; color:var(--la); font-weight:700; }
  #sheet h2 { margin:1vh 0 .6vh; font-size:5vh; font-weight:800; letter-spacing:-.02em; line-height:1.05; }
  #sheet p { margin:0 0 3vh; font-size:1.8vh; color:rgba(255,255,255,.66); }
  #sheet .acts { display:flex; flex-wrap:wrap; gap:1.2vh; }
  #sheet .x { position:absolute; right:2vh; top:2vh; }
  #lib .cta { background:var(--la); color:#0b0b12; }
  #lib .hb.on, #lib .lrow:hover .hb.on { color:var(--la); }
  #lib .lsearch:focus-within { border-color:var(--la); }
  #lib .lrow.cur { background:color-mix(in srgb, var(--la) 22%, transparent); }
  #lib .lrow.cur b { color:var(--la); }
  #lib .lcard img { border-radius:var(--lrad); }
  #lib .lrow img, #lib .lph { border-radius:calc(var(--lrad) * .6); }
  body.ready[data-view="library"] #lib { opacity:1; pointer-events:auto; scale:1; }
  .ltop { display:flex; align-items:center; gap:12px; }
  .lsearch { flex:1; height:48px; border-radius:99px; display:flex; align-items:center; gap:12px; padding:0 20px;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); transition:.25s; }
  .lsearch:focus-within { background:rgba(255,255,255,.16); border-color:var(--ac); }
  .lsearch svg { opacity:.7; flex:none; }
  #lq { flex:1; background:none; border:0; outline:0; color:#fff; font:inherit; font-size:15px; user-select:text; }

const svc = () => SERVICES.find(s => s.id === S.service) || null;
const isWeb = () => !!S.service && S.service !== 'system';

let S = {}, st = { playing:false, pos:0, dur:0, at:Date.now(), title:'' }, art = '', AD = null, artistKey = '', view = 'ambiance';
let cards = [], focus = 0, cardKey = '';
let lyr = null, lyrKey = '', lyrIdx = -2;

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = 'none'; }, 4500); }

function clock() {
  const d = new Date();
  $('time').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  const s = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
  $('date').textContent = s.charAt(0).toUpperCase() + s.slice(1);
}
clock(); setInterval(clock, 5000);

// ================= écrans =================
function setView(v) {
  if (v === 'service' && !isWeb()) v = 'library';
  if (v !== 'home' && !S.service) v = 'home';
  view = v; document.body.dataset.view = v;
  $('bLib').classList.toggle('on', v === 'library');
  invoke('player_show', { show: v === 'service' });
  if (v === 'home') renderTiles();
  if (v === 'library') renderLib();
  updateEmpty(); setLyrMode(); syncVideo();
}
const WEB = () => SERVICES.filter(x => x.id !== 'system');
let orbFocus = 0;
function renderTiles() {
  const list = WEB(); orbFocus = Math.max(0, list.findIndex(x => x.id === S.service));
  $('tiles').innerHTML = list.map((x, i) => `<div class="orb" data-k="${i}" style="--sc:${x.color};animation-delay:${100 + i * 70}ms">${x.icon}</div>`).join('');
  $('homeEsc').textContent = S.service ? 'Échap pour revenir' : '← → pour choisir · Entrée pour valider';
  layoutOrbs();
}
function layoutOrbs() {
  const list = WEB();
  [...$('tiles').children].forEach((el, k) => {
    const a = Math.abs(k - orbFocus);
    el.classList.toggle('h0', a === 0); el.classList.toggle('h1', a === 1);
    el.classList.toggle('cur', list[k].id === S.service);
  });
  const x = list[orbFocus];
  $('orbName').textContent = x.name;
  $('orbSub').textContent = (S.logged || {})[x.id] ? 'Connecté — clique pour entrer (Maj + clic pour te reconnecter)' : 'Clique pour te connecter';
}
function orbGo(k) { orbFocus = Math.max(0, Math.min(WEB().length - 1, k)); layoutOrbs(); }
$('tiles').onmouseover = (e) => { const o = e.target.closest('.orb'); if (o && +o.dataset.k !== orbFocus) orbGo(+o.dataset.k); };
$('tiles').onclick = (e) => { const o = e.target.closest('.orb'); if (o) chooseService(WEB()[+o.dataset.k].id, e.shiftKey); };
$('homeSys').onclick = () => chooseService('system');
async function chooseService(id, forceLogin) {
  S.service = id; invoke('set_settings', { patch: { service: id } }); renderService();
  if (id === 'system') { invoke('close_service'); return setView('library'); }
  if ((S.logged || {})[id] && !forceLogin) { invoke('open_service', { id, show: false, login: false }).catch(() => {}); return setView('ambiance'); }
  try { await invoke('open_service', { id, show: true, login: true }); setView('service'); }
  catch (e) { toast('Impossible d\u2019ouvrir ce service : ' + e); }
}

function loadImg(src) {
  return new Promise((res) => {
    if (!src) return res(null);

    im.onload = () => res(im); im.onerror = () => res(null); im.src = src;

async function bake(noArt) {
  const seq = ++bakeSeq, W = 1920, H = Math.round(1920 * innerHeight / innerWidth);
  const artImg = noArt ? null : await loadImg(wallSrc());
  if (seq !== bakeSeq) return;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#07070b'; g.fillRect(0, 0, W, H);
  const cover = (im, zoom) => { const k = Math.max(W / im.width, H / im.height) * zoom, w = im.width * k, h = im.height * k; g.drawImage(im, (W - w) / 2, (H - h) / 2, w, h); };
  if (artImg) { g.filter = 'brightness(0.55) saturate(1.15)' + (artImg.width < 1000 ? ' blur(4px)' : ''); cover(artImg, 1.03); g.filter = 'none'; }
  else if (wallImg) { g.filter = 'brightness(0.6)'; cover(wallImg, 1); g.filter = 'none'; }
  const v = g.createRadialGradient(W / 2, H * 0.45, H * 0.3, W / 2, H * 0.45, W * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  try {
    const url = await toUrl(c, 0.9);
    const c2 = document.createElement('canvas'); c2.width = W / 2; c2.height = H / 2;
    const g2 = c2.getContext('2d'); g2.filter = 'blur(12px) saturate(1.7) brightness(1.2)';
    g2.drawImage(c, -16, -16, W / 2 + 32, H / 2 + 32);
    const url2 = await toUrl(c2, 0.85);
    if (seq !== bakeSeq) return;
    $('bg').src = url; root.setProperty('--frost', `url(${url2})`);
    urls.forEach(u => URL.revokeObjectURL(u)); urls = [url, url2];
  } catch { if (!noArt) bake(true); }
}

  const ws = wallSrc(); if (ws !== bakedFor) { bakedFor = ws; bake(); }

}

async function loadArtist(raw) {
  const artist = (raw || '').split(/,| feat/i)[0].trim();
  if (artist === artistKey) return;
  artistKey = artist; AD = null;
  if (!artist) { buildCards(); buildSide(); return; }
  const found = await getJson(DZ + '/search/artist?' + new URLSearchParams({ q: artist, limit: '1' }));
  const a = found && found.data && found.data[0];
  if (!a || artist !== artistKey) return;
  const [top, albums] = await Promise.all([getJson(`${DZ}/artist/${a.id}/top?limit=10`), getJson(`${DZ}/artist/${a.id}/albums?limit=20`)]);
  if (artist !== artistKey) return;
  const seen = new Set();
  AD = { artist: a.name,
    tracks: ((top && top.data) || []).map(x => mkTrack(x)),
    albums: ((albums && albums.data) || []).map(x => ({ ...mkAlbum(x), artist: a.name })).filter(x => { const k = norm(x.name); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 14) };

async function playTrack(t, stay) {
  const q = `${t.artist} ${t.name}`;
  try {
    if (isWeb()) {   // tous les services : lecture par le moteur vérifié
      const ids = rankVideos(await invoke('video_search', { q: q + ' official video' }), t);
      if (!ids.length) return toast('Titre introuvable.');
      vidIds = ids; vidIdx = 0; await ytApi(); playNextId();
    } else if (S.service === 'deezer') {
      let id = t.id;
      if (!id) { const r = await getJson(DZ + '/search?' + new URLSearchParams({ q, limit: '1' })); id = r && r.data && r.data[0] && r.data[0].id; }
      if (!id) return toast('Titre introuvable.');
      await invoke('player_open', { id: 'deezer', path: `/track/${id}?autoplay=true` });
    } else if (isWeb()) {   // l'app cherche et lance le titre dans le lecteur caché du service
      await invoke('player_play', { id: S.service, q });
      const want = norm(t.name), name = svc().name;   // si le service ne démarre pas, on le dit au lieu de rester muet
      setTimeout(() => { if (!st.playing || norm(st.title) !== want) toast(`${name} n'a pas démarré « ${t.name} ». La lecture automatique marche avec YouTube Music.`); }, 15000);
    } else {
      const src = (st.app || '').toLowerCase();
      invoke('open_url', { url: /spotify/.test(src) ? 'spotify:search:' + encodeURIComponent(q) : 'https://music.youtube.com/search?q=' + encodeURIComponent(q) });
      return;
    }
    navAt = Date.now(); pushRecent(t);
    if (!stay) setView('ambiance');
  } catch (e) { toast('Lecture impossible : ' + e); }
}
// Classe les vidéos trouvées : bon titre, bon artiste, durée proche de l'original ; les lives, reprises et remix passent derrière.
function rankVideos(list, t) {
  const name = norm(t.name), artist = norm((t.artist || '').split(/,| feat/i)[0]), want = (t.ms || 0) / 1000, low = (t.name || '').toLowerCase();
  const bad = ['live', 'cover', 'reprise', 'karaok', 'reaction', 'sped up', 'slowed', 'nightcore', '8d', 'remix', 'instrumental', 'teaser', 'trailer', 'parod', 'tutorial', 'tuto'].filter(w => !low.includes(w));
  return (list || []).map((v, i) => {
    const ti = (v.title || '').toLowerCase(); let sc = -i * 0.6;
    if (name && ti.includes(name)) sc += 6;
    if (artist && ti.includes(artist)) sc += 3;
    if (/official|officiel|clip/.test(ti)) sc += 2;
    for (const w of bad) if (ti.includes(w)) sc -= 5;
    if (want && v.secs) { const d = Math.abs(v.secs - want); sc += d < 6 ? 4 : d < 25 ? 2 : d > 120 ? -4 : 0; }
    return { id: v.id, sc };

function step(d) {
  if (direct() && queue.length && queue[qi + d]) { qi += d; sideKey = ''; return playTrack(queue[qi], true); }
  invoke('media_cmd', { name: d > 0 ? 'next' : 'prev' });
}

function parseLrc(text) {

    const m = raw.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);

  }

}

    const r = await getJson('https://lrclib.net/api/get?' + new URLSearchParams({ track_name: t, artist_name: st.artist, duration: String(Math.round(st.dur / 1000)) }));

}

$('bLyr').onclick = () => flip('lyrics');
$('bSpark').onclick = () => flip('sparks');
$('bLight').onclick = () => flip('light');
$('bHide').onclick = () => hideApp();
function hideApp() {   // fermer l'app coupe la musique
  try { if (player && playerOk && player.getPlayerState() === 1) player.pauseVideo(); } catch {}
  invoke('win', { action: 'hide' });
}
const zen = (on) => document.body.classList.toggle('zen', on);
$('bZen').onclick = () => { setView('ambiance'); zen(true); toast('Mode veille : clique ou appuie sur une touche pour revenir.'); };
addEventListener('mousedown', () => { if (document.body.classList.contains('zen')) zen(false); }, true);
addEventListener('keydown', (e) => {
  if (document.body.classList.contains('zen')) { zen(false); return; }
  if (e.target.tagName === 'INPUT') return;
  if (view === 'home') {
    if (e.key === 'ArrowRight') return orbGo(orbFocus + 1);
    if (e.key === 'ArrowLeft') return orbGo(orbFocus - 1);
    if (e.key === 'Enter') return chooseService(WEB()[orbFocus].id);
  }
  if (e.key === 'ArrowRight') go(focus + 1);
  else if (e.key === 'ArrowLeft') go(focus - 1);
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Escape') { if ((view === 'home' && S.service) || view === 'service') setView('library'); else if (view === 'library') setView('ambiance'); else hideApp(); }
});
addEventListener('contextmenu', (e) => e.preventDefault());

// ================= interactions à la souris =================
$('mark').onclick = () => setView('home');
let moveRaf = 0, lastMove = null, tiltEl = null;
addEventListener('mousemove', (e) => {
  lastMove = e;
  if (moveRaf) return;
  moveRaf = requestAnimationFrame(() => {
    moveRaf = 0; const ev = lastMove;
    $('glow').style.transform = `translate(${ev.clientX}px, ${ev.clientY}px)`;        // halo qui suit la souris
    const el = ev.target.closest ? ev.target.closest('.cv, .lcard img') : null;   // pochettes qui s'inclinent sous la souris
    if (el !== tiltEl) { if (tiltEl) tiltEl.style.transform = ''; tiltEl = el; }
    if (!el) return;
    const r = el.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width - 0.5, py = (ev.clientY - r.top) / r.height - 0.5;
    el.style.transform = `perspective(700px) rotateY(${(px * 7).toFixed(1)}deg) rotateX(${(-py * 7).toFixed(1)}deg) scale(1.025)`;
  });
});

// ================= données =================
function cleanTitle(s) {
  if (!s.title) return;
  // titre lancé par l'app : on connaît le vrai titre et le vrai artiste (YouTube donne le nom de la chaîne)
  const q = queue[qi];
  if (q && direct() && /webview/i.test(s.app || '')) { s.title = q.name; s.artist = q.artist; if (q.album) s.album = q.album; return; }
  // publicité avant le titre : on garde à l'écran le morceau demandé plutôt que le nom de la pub
  if (q && direct() && s.dur > 0 && s.dur < 65000 && Date.now() - navAt < 120000) { s.title = q.name; s.artist = q.artist; if (q.album) s.album = q.album; s.pos = 0; s.dur = 0; return; }
  let t = s.title.replace(/\s*[(\[][^)\]]*(official|officiel|video|vidéo|clip|audio|lyrics?|visuali[sz]er|4k|hd)[^)\]]*[)\]]/gi, '');
  const ar = (s.artist || '').split(/,| feat/i)[0].trim();
  if (ar && t.toLowerCase().startsWith(ar.toLowerCase())) { const rest = t.slice(ar.length), cutd = rest.replace(/^\s*[-–—:|]\s*/, ''); if (cutd !== rest) t = cutd; }
  s.title = t.trim() || s.title;
}
function onState(s) {
  cleanTitle(s);
  const ch = s.title !== st.title || s.album !== st.album || s.artist !== st.artist;
  st = s; renderState(); syncVideo();
  if (ch) { buildCards(); buildSide(); loadArtist(s.artist); loadLyrics(); if (view === 'library') renderLib(); }
}
// Quand c'est l'app qui joue, l'état vient directement de son lecteur (identique sur Windows, Mac et Linux).
const ownPlayer = () => direct() && player && playerOk && qi >= 0 && !!queue[qi];
listen('state', (s) => { if (!ownPlayer()) onState(s); });
setInterval(() => {
  if (!ownPlayer()) return;
  let ps = -1, cur = 0, dur = 0;
  try { ps = player.getPlayerState(); cur = player.getCurrentTime() || 0; dur = player.getDuration() || 0; } catch { return; }
  const q = queue[qi];
  if ((q.art || '') && art !== q.art) { art = q.art; cardKey = ''; sideKey = ''; buildCards(); buildSide(); renderArt(); }
  onState({ title: q.name, artist: q.artist, album: q.album || '', app: 'onda', playing: ps === 1 || ps === 3, pos: Math.round(cur * 1000), dur: Math.round(dur * 1000), at: Date.now() });
}, 500);
listen('art', (x) => { if (ownPlayer()) return; art = x; buildCards(); buildSide(); renderArt(); });
listen('settings', (s) => { S = s; renderSettings(); });
invoke('wallpaper').then(async (w) => { wallImg = await loadImg(w); bakedFor = null; renderArt(); });

function start() {
  invoke('init').then((d) => {
    S = d.settings; art = d.art; renderSettings(); st = { title: '\u0000' }; onState(d.state); renderArt();
    window.__dbg = !!d.demo;
    if (d.demo === 'alb') { S.service = 'apple'; renderService(); setView('ambiance'); invoke('open_service', { id: 'apple', show: false, login: false }); setTimeout(async () => { await loadAccount(); const a = acctGet(), x = a && a.added.find(y => (y.t || '').includes('album')); if (x) playAlbum(acT(x)); }, 9000); }
    else if (d.demo === 'acct') { S.service = 'apple'; renderService(); setView('ambiance'); invoke('open_service', { id: 'apple', show: false, login: false }); setTimeout(async () => { await loadAccount(); setView('library'); }, 9000); setTimeout(() => { const a = acctGet(); if (a && a.lists && a.lists[0]) libGo({ page: 'plist', id: a.lists[0].id, name: a.lists[0].n }); else libGo({ page: 'lists' }); }, 24000); }
    else if (d.demo === 'home') { S.service = ''; setView('home'); }
    else if (d.demo === 'login') { S.service = 'spotify'; renderService(); invoke('open_service', { id: 'spotify', show: true, login: true }); setView('service'); }
    else if (d.demo === 'amb') { S.service = 'system'; setView('ambiance'); }
    else if (d.demo === 'lib') { S.service = 'spotify'; renderService(); setView('library'); }
    else if (d.demo === 'ap') { S.service = 'apple'; renderService(); setView('ambiance'); invoke('open_service', { id: 'apple', show: false, login: false }); setTimeout(() => playTrack({ name: 'Another Love', artist: 'Tom Odell' }, true), 9000); }
    else if (d.demo === 'yt' || d.demo === 'dz') {   // essai de lecture réelle dans le lecteur intégré
      S.service = d.demo === 'yt' ? 'ytmusic' : 'deezer'; renderService(); setView('ambiance');
      playFrom([{ id: 3135553, name: 'One More Time', artist: 'Daft Punk', album: 'Discovery', ms: 320000, art: 'https://cdn-images.dzcdn.net/images/cover/5718f7c81c27e0b2417e2a4c45224f8a/250x250-000000-80-0-0.jpg' }], 0);
      if (d.demo === 'yt') {
        setTimeout(() => invoke('player_nav', { action: 'consent_reject' }), 7000);
        setTimeout(() => playTrack({ id: 3135553, name: 'One More Time', artist: 'Daft Punk' }, true), 12000);
      }
      setTimeout(() => setView('service'), 26000);
    }
    else if (!S.service) setView('home');
    else { if (isWeb()) invoke('open_service', { id: S.service, show: false, login: false }).catch(() => {}); setView('library'); }
    setTimeout(loadAccount, 9000);   // la musique du compte, une fois la page du service chargée
    // lancement : le logo se dessine, puis l'interface arrive par vagues
    setTimeout(() => { $('splash').classList.add('gone'); document.body.classList.add('ready'); setTimeout(() => document.body.classList.add('settled'), 1600); }, 3200);
  }).catch(() => setTimeout(start, 500));
}
start();
</script>
