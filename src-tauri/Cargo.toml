[package]
name = "lueur"
version = "1.0.11"
description = "La lumière qui danse avec ta musique."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
serde_json = "1"
base64 = "0.22"
cpal = "0.15"
ureq = "2"
open = "5"
sha2 = "0.10"
getrandom = "0.2"


[profile.release]
opt-level = 3
strip = true

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-localhost = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_WinRT",
] }
